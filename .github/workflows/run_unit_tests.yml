name: Run Unit Tests

on:
  pull_request:
    branches:
      - master
      - develop 
  push:
    branches:
      - master
      - develop
jobs:
  unit_tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 9.x 

    - name: Restore dependencies
      run: dotnet restore src/IssueManager.sln

    - name: Run tests
      run: dotnet test src/IssueManager.sln --verbosity normal